[package]
name = "chimi"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
backend-benchmarks = []
frontend-benchmarks = []

[[bin]]
name = "chimi"
path = "src/main.rs"

[[bench]]
name = "frontend"
harness = false
required-features = ["frontend-benchmarks"]

[[bench]]
name = "backend"
harness = false
required-features = ["backend-benchmarks"]
