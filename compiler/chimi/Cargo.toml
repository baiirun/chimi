[package]
name = "chimi"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false
default-run = "chimi"

[features]
default = ["native-backend"]
backend-benchmarks = []
frontend-benchmarks = []
embedded-bytecode-prototype = []
native-aot-prototype = ["native-backend"]
native-backend = [
  "dep:chimi-fiber",
  "dep:blake3",
  "dep:cranelift-codegen",
  "dep:cranelift-frontend",
  "dep:cranelift-module",
  "dep:cranelift-native",
  "dep:cranelift-object",
]

[dependencies]
chimi-fiber = { path = "../../runtime/chimi-fiber", optional = true }
blake3 = { version = "=1.8.6", optional = true }
cranelift-codegen = { version = "=0.131.3", optional = true }
cranelift-frontend = { version = "=0.131.3", optional = true }
cranelift-module = { version = "=0.131.3", optional = true }
cranelift-native = { version = "=0.131.3", optional = true }
cranelift-object = { version = "=0.131.3", optional = true, default-features = false }

[build-dependencies]
blake3 = "=1.8.6"

[[bin]]
name = "chimi"
path = "src/main.rs"

[[bin]]
name = "chimi-aot-prototype"
path = "src/bin/aot_prototype.rs"
required-features = ["native-aot-prototype"]

[[bin]]
name = "chimi-bytecode-prototype"
path = "src/bin/bytecode_prototype.rs"
required-features = ["embedded-bytecode-prototype"]

[[bin]]
name = "chimi-concurrency-lab"
path = "src/bin/concurrency_lab.rs"
required-features = ["native-backend"]

[[bench]]
name = "frontend"
harness = false
required-features = ["frontend-benchmarks"]

[[bench]]
name = "backend"
harness = false
required-features = ["backend-benchmarks"]
