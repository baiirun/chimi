# Default expectations for unannotated ```chimi blocks, keyed by document path
# or directory prefix; the longest matching key wins. Statuses are the
# annotation forms from tests/doc_examples.rs, plus `unreviewed`: compiled and
# reported, never enforced.
#
# These documents are owned by other work in progress and are not yet
# annotated. Remove an entry once its document's blocks carry annotations.
[defaults]
"docs/plans/standard-library-sketches/" = "unreviewed"
"docs/specification/core-data-and-operators.md" = "unreviewed"
"docs/specification/supervised-process-conformance.md" = "unreviewed"
