[workspace]
members = [
    "compiler/chimi",
    "compiler/chimi-lsp",
    "runtime/chimi-fiber",
    "runtime/chimi-runtime",
    "runtime/chimi-runtime-standalone",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.92"

[profile.dev]
opt-level = 1

[profile.release]
strip = "symbols"

# The Rust runtime archive of a program without the scheduler
# (runtime/chimi-runtime-standalone). `no_std` needs `panic = "abort"`, and
# one optimized object keeps only the code the C runtime calls.
[profile.runtime-standalone]
inherits = "release"
panic = "abort"
lto = true
codegen-units = 1
strip = "none"
