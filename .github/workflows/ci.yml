# Runs the full test suite off the developer's machine. Implementers run only
# the tests that cover their change locally; this is the full check that every
# merge candidate (a wip/* branch) and main must pass. A pull request merges
# on green CI, which replaces scripts/integrate-branch.sh:
# - `test` runs check-head.sh's two cargo commands on a fresh checkout of the
#   exact commit, so local uncommitted work cannot leak in, which is what
#   check-head.sh's `git archive` export guards against. Unlike that export,
#   the checkout keeps `.git`; nothing in the build or tests reads it.
# - `program-outputs` compares what the example programs print and trace on
#   the pull request's merge result against its base branch.
name: ci

on:
  push:
    branches: [main, "wip/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS covers the arm64 fiber stacks and signal handling that most
        # local work runs on; Linux covers the x86_64 paths nothing else runs.
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # Pinned: the interpreter's case mapping is Rust's own, and the native
      # runtime's generated tables must match that Unicode version (17.0.0
      # in 1.97). Bump it together with compiler/chimi/unicode/.
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # tests/postgres.rs runs a real PostgreSQL server. Ubuntu's image ships
      # one; macOS's does not, and the test finds Homebrew's keg-only build.
      - name: Install PostgreSQL (macOS)
        if: runner.os == 'macOS'
        run: brew install postgresql@16
      - name: Test the workspace
        run: cargo test --workspace --quiet
      - name: Check feature-gated targets
        run: cargo check --workspace --all-targets --all-features --quiet
      - name: Clippy
        run: cargo clippy --workspace --all-targets --quiet -- -D warnings -A function-casts-as-integer

  # The test suite again, with every native program's C runtime and binding
  # packages built with AddressSanitizer and UndefinedBehaviorSanitizer
  # (CHIMI_TEST_RUNTIME_SANITIZE in backend/native.rs), so a memory error or
  # undefined behaviour in the C fails the test that reached it.
  # Under the sanitizers the suite takes about an hour and a half, so it runs
  # in six shards (scripts/sanitizer-shard.sh).
  sanitizers:
    name: sanitizers (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [cli, process-lab, rest-1, rest-2, rest-3, rest-4]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CHIMI_TEST_RUNTIME_SANITIZE: address,undefined
      # Reports go to files, not stderr, so the tests that compare a
      # program's stderr still pass; the last step fails on any report. The
      # fibers' stack switches make ASan print a warning there too, which is
      # not a failure. The runtime keeps its memory until exit by design.
      ASAN_OPTIONS: detect_leaks=0:log_path=${{ github.workspace }}/../sanitizer-logs/asan
      UBSAN_OPTIONS: print_stacktrace=1:log_path=${{ github.workspace }}/../sanitizer-logs/ubsan
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      # Sanitized frames are several times larger, so the host thread gets
      # four times the stack, as runtime.c gives its fibers.
      - name: Test the workspace with sanitized native programs
        run: |
          mkdir -p ../sanitizer-logs
          ulimit -s 32768
          scripts/sanitizer-shard.sh ${{ matrix.shard }}
      - name: Fail on any sanitizer report
        if: always()
        run: |
          if grep -l -E "ERROR: (AddressSanitizer|LeakSanitizer)|runtime error:" ../sanitizer-logs/* 2>/dev/null; then
            grep -h -A40 -E "ERROR: (AddressSanitizer|LeakSanitizer)|runtime error:" ../sanitizer-logs/*
            exit 1
          fi

  # libFuzzer on the runtime's parsers and text code and on the binding
  # packages' shims, two minutes a target, from the committed corpus
  # (compiler/chimi/tests/fuzz/).
  fuzz:
    name: fuzz (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target:
          [json, text, decimal, duration, float, metrics, tls-client, tls-server, tls-records, tls-roots, scram, sqlite]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # The parsers that moved to Rust are fuzzed in the runtime's Rust archive.
      - uses: dtolnay/rust-toolchain@1.97.0
      # The runner's clang may come without its libFuzzer runtime.
      - name: Install libFuzzer
        run: |
          printf 'int LLVMFuzzerTestOneInput(const char *d, long n) { return 0; }\n' > "$RUNNER_TEMP/probe.c"
          if ! clang -fsanitize=fuzzer "$RUNNER_TEMP/probe.c" -o "$RUNNER_TEMP/probe"; then
            version=$(clang -dumpversion | cut -d. -f1)
            sudo apt-get update -q
            sudo apt-get install -y -q "libclang-rt-$version-dev"
          fi
      - name: Fuzz
        run: scripts/fuzz-runtime.sh ${{ matrix.target }} 120 "$RUNNER_TEMP/fuzz"
      - name: Keep the failing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/fuzz/crash-*
            ${{ runner.temp }}/fuzz/oom-*
            ${{ runner.temp }}/fuzz/timeout-*
            ${{ runner.temp }}/fuzz/slow-unit-*
          if-no-files-found: ignore

  # The editor grammar is written by hand next to the compiler's parser, so
  # it falls behind silently when the syntax grows. This fails when any .chimi
  # file the compiler parses does not parse in the grammar.
  grammar:
    name: editor grammar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Pinned: src/parser.c is generated, and the check regenerates it and
      # compares, so CI must run the version that generated it.
      - name: Install tree-sitter
        run: npm install --global tree-sitter-cli@0.25.6
      - name: Build chimi
        run: cargo build --quiet -p chimi --bin chimi
      - name: Check the grammar
        run: scripts/check-grammar.sh

  program-outputs:
    name: program outputs (${{ matrix.os }})
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # A pull_request run checks out the merge result; its first parent is
      # the base branch's tip.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      # Each tree records with its own copy of the script, as
      # integrate-branch.sh did, so a pull request that changes the script or
      # adds a program shows up as a difference rather than a broken baseline.
      # The base tree builds into its own target directory: cargo judges
      # workspace crates fresh by mtime, and the base worktree's files are
      # newer than the merge result's checkout, so a shared target directory
      # would run the base compiler for both recordings.
      - name: Record outputs on the base branch
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/base-target
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" HEAD^1
          "$RUNNER_TEMP/base/scripts/compare-programs.sh" record "$RUNNER_TEMP/base-outputs"
      - name: Compare outputs on the merge result
        run: scripts/compare-programs.sh compare "$RUNNER_TEMP/base-outputs"
