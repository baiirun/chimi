[package]
name = "chimi-runtime"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
doctest = false

[features]
# The binding packages written in Rust (`src/binding`). They import the
# binding API from `runtime.c`, so only the runtime archives that link with it
# turn this on: `compiler/chimi/build.rs` passes it to its nested builds of
# the fiber and standalone archives, and nothing in the workspace enables it.
bindings = []

[target.'cfg(unix)'.dependencies]
# The pthread mutex behind `Locked`, and the bindings' system calls.
libc = { version = "=0.2.189", default-features = false }
